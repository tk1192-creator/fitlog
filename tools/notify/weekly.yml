# STRIDE 今週のふりかえりを LINE で家族に送る（保存先リポジトリ stride-○○ に .github/workflows/weekly.yml として置く）
# 日曜 21:17（日本時間）に送る。遅れ・取りこぼしに備えて 21:47 にも動かし、同じ週は 1 回だけ送る。
name: STRIDE 今週のふりかえり（LINE）

on:
  schedule:
    - cron: '17 12 * * 0'  # 日曜 21:17（日本時間）
    - cron: '47 12 * * 0'  # 日曜 21:47（保険）
  workflow_dispatch:
    inputs:
      test:
        description: 'テスト送信（今すぐ送る。送信済みの記録は残さない）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stride-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node .github/scripts/weekly.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          TEST: ${{ inputs.test || false }}
