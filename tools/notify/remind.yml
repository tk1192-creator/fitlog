# STRIDE のお知らせ（保存先リポジトリ stride-○○ に .github/workflows/remind.yml として置く）
# 朝 7 時：今日の運動の予定を知らせる。夜 21 時：体重の記録忘れ・予定の運動の記録忘れ・休みが続いたときに知らせる。
# 送り先は登録した端末と LINE（設定時）。定時実行は混雑で遅れたり飛ばされたりすることがあるため、
# 朝は 7:03・7:33、夜は 21:07・21:37・22:07 に動かし、朝・夜それぞれ 1 日 1 回だけ送る。
name: STRIDE 入力忘れのお知らせ

on:
  schedule:
    - cron: '3 22 * * *'   # 7:03（日本時間。前日の 22:03 UTC）
    - cron: '33 22 * * *'  # 7:33（遅れ・取りこぼしの保険）
    - cron: '7 12 * * *'   # 21:07（日本時間）
    - cron: '37 12 * * *'  # 21:37（遅れ・取りこぼしの保険）
    - cron: '7 13 * * *'   # 22:07（同上）
  workflow_dispatch:
    inputs:
      test:
        description: 'テスト通知（記録の有無に関係なく、今すぐ送る）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stride-remind
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-save --no-audit --no-fund web-push@3
      - run: node .github/scripts/remind.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TEST: ${{ inputs.test || false }}
