<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="筋トレ・ジョギング・体重・タスクを記録して、毎日の前進を確認できるアプリ">
  <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0e15" media="(prefers-color-scheme: dark)">
  <title>STRIDE 運動・体重・タスク管理</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="STRIDE">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="./js/lock.js"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <div class="appbar-left">
        <span class="brand" aria-hidden="true">STRIDE<b>›</b></span>
        <h1 id="title">ホーム</h1>
      </div>
      <div class="clock" aria-label="現在の日時">
        <span id="clock-date" class="clock-date"></span>
        <time id="clock-time" class="clock-time"></time>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="画面切替">
    <button type="button" class="tab active" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>ホーム</span>
    </button>
    <button type="button" class="tab" data-tab="records">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>記録</span>
    </button>
    <button type="button" class="tab" data-tab="charts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M6 15l4-5 4 3 5-7"/></svg>
      <span>グラフ</span>
    </button>
    <button type="button" class="tab" data-tab="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>カレンダー</span>
    </button>
    <a class="tab" href="./tasks/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="m8 9 1.5 1.5L12 8M8 15l1.5 1.5L12 14M14.5 9.5H17M14.5 15.5H17"/></svg>
      <span>タスク</span>
    </a>
    <button type="button" class="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
      <span>設定</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"></dialog>

  <noscript><p class="noscript">このアプリを使うには JavaScript を有効にしてください。</p></noscript>

  <script src="./js/version.js"></script>
  <script src="./lib/chart.umd.min.js"></script>
  <script src="./lib/confetti.browser.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
